<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SA Tender Dashboard</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="container">
  <header>
    <h1>🇿🇦 South African Tender Dashboard</h1>
    <p class="subtitle">Aggregated from National Treasury OCDS & Tenders-SA</p>
    <div class="stats-bar" id="stats">
      <div class="stat"><span class="stat-value" id="stat-total">-</span><span class="stat-label">Total</span></div>
      <div class="stat"><span class="stat-value" id="stat-active">-</span><span class="stat-label">Active</span></div>
      <div class="stat"><span class="stat-value" id="stat-value">-</span><span class="stat-label">Total Value (ZAR)</span></div>
      <div class="stat"><span class="stat-value" id="stat-7d">-</span><span class="stat-label">Last 7 Days</span></div>
    </div>
  </header>

  <section class="controls">
    <div class="search-row">
      <input type="text" id="search-input" placeholder="Search tenders, buyers, references..." autocomplete="off">
      <button id="search-btn" class="btn-primary">Search</button>
      <button id="reset-btn" class="btn-secondary">Reset</button>
      <button id="ingest-btn" class="btn-accent">🔄 Refresh Data</button>
    </div>
    <div class="filters-row">
      <select id="filter-province"><option value="">All Provinces</option></select>
      <select id="filter-category"><option value="">All Categories</option></select>
      <select id="filter-source"><option value="">All Sources</option></select>
      <select id="filter-status"><option value="">All Statuses</option><option value="active">Active</option><option value="complete">Complete</option><option value="cancelled">Cancelled</option><option value="planning">Planning</option></select>
      <select id="sort-by">
        <option value="published_date">Sort by Date</option>
        <option value="closing_date">Sort by Closing</option>
        <option value="value_amount">Sort by Value</option>
        <option value="title">Sort by Title</option>
      </select>
      <select id="sort-order">
        <option value="desc">Desc</option>
        <option value="asc">Asc</option>
      </select>
    </div>
  </section>

  <section class="results">
    <div class="results-header">
      <span id="result-count">Loading...</span>
    </div>
    <div id="tender-list" class="tender-list"></div>
    <div class="pagination" id="pagination"></div>
  </section>

  <footer>
    <p>Data sourced from <a href="https://data.etenders.gov.za" target="_blank">National Treasury</a> and <a href="https://www.tenders-sa.org" target="_blank">Tenders-SA</a>. Private dashboard.</p>
  </footer>
</div>

<script>
const API = {
  tenders: '/api/tenders',
  filters: '/api/filters',
  stats: '/api/stats',
  ingest: '/api/ingest',
};

let state = {
  q: '',
  province: '',
  category: '',
  source: '',
  status: '',
  sort_by: 'published_date',
  sort_order: 'desc',
  page: 1,
  page_size: 20,
};

async function fetchJSON(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error(`${r.status} ${r.statusText}`);
  return r.json();
}

function buildQuery() {
  const p = new URLSearchParams();
  if (state.q) p.set('q', state.q);
  if (state.province) p.set('province', state.province);
  if (state.category) p.set('category', state.category);
  if (state.source) p.set('source', state.source);
  if (state.status) p.set('status', state.status);
  p.set('sort_by', state.sort_by);
  p.set('sort_order', state.sort_order);
  p.set('page', state.page);
  p.set('page_size', state.page_size);
  return p.toString();
}

function fmtDate(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  return d.toLocaleDateString('en-ZA', { day:'2-digit', month:'short', year:'numeric' });
}

function fmtCurrency(n, currency) {
  if (n == null || n === 0) return '—';
  return new Intl.NumberFormat('en-ZA', { style:'currency', currency: currency||'ZAR', maximumFractionDigits:0 }).format(n);
}

function renderTenders(data) {
  const list = document.getElementById('tender-list');
  const count = document.getElementById('result-count');
  count.textContent = `${data.total} tender${data.total!==1?'s':''} (page ${data.page} of ${data.pages})`;

  if (data.items.length === 0) {
    list.innerHTML = '<div class="empty">No tenders match your filters.</div>';
    return;
  }

  list.innerHTML = data.items.map(t => {
    const statusClass = (t.status||'').toLowerCase().replace(/\s+/g,'-');
    return `
    <article class="tender-card">
      <div class="tender-header">
        <h3 class="tender-title">${escapeHtml(t.title)}</h3>
        <span class="tender-status ${statusClass}">${t.status || 'Unknown'}</span>
      </div>
      <div class="tender-meta">
        <span class="meta-pill province">${t.province || 'National'}</span>
        <span class="meta-pill category">${t.category || 'Uncategorized'}</span>
        <span class="meta-pill source">${t.source_name}</span>
        ${t.reference_number ? `<span class="meta-pill ref">Ref: ${escapeHtml(t.reference_number)}</span>` : ''}
      </div>
      <p class="tender-desc">${escapeHtml(t.description || '').substring(0, 280)}${(t.description||'').length>280?'…':''}</p>
      <div class="tender-footer">
        <div class="footer-col">
          <span class="label">Buyer</span>
          <span class="value">${escapeHtml(t.buyer_name || '—')}</span>
        </div>
        <div class="footer-col">
          <span class="label">Value</span>
          <span class="value">${fmtCurrency(t.value_amount, t.value_currency)}</span>
        </div>
        <div class="footer-col">
          <span class="label">Published</span>
          <span class="value">${fmtDate(t.published_date)}</span>
        </div>
        <div class="footer-col">
          <span class="label">Closing</span>
          <span class="value ${isClosingSoon(t.closing_date)?'urgent':''}">${fmtDate(t.closing_date)}</span>
        </div>
        <div class="footer-col actions">
          ${t.source_url ? `<a href="${t.source_url}" target="_blank" class="btn-link">View Source →</a>` : ''}
        </div>
      </div>
    </article>`;
  }).join('');
}

function isClosingSoon(iso) {
  if (!iso) return false;
  const d = new Date(iso);
  const now = new Date();
  const days = (d - now) / (1000*60*60*24);
  return days >= 0 && days <= 7;
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

function renderPagination(data) {
  const el = document.getElementById('pagination');
  if (data.pages <= 1) { el.innerHTML = ''; return; }

  let html = '';
  // Prev
  html += `<button class="page-btn" ${data.page===1?'disabled':''} data-page="${data.page-1}">← Prev</button>`;

  // First + ellipsis logic
  const maxButtons = 7;
  let start = Math.max(1, data.page - 3);
  let end = Math.min(data.pages, start + maxButtons - 1);
  if (end - start < maxButtons - 1) start = Math.max(1, end - maxButtons + 1);

  if (start > 1) html += `<button class="page-btn" data-page="1">1</button>${start>2?'<span class="page-ellipsis">…</span>':''}`;
  for (let i = start; i <= end; i++) {
    html += `<button class="page-btn ${i===data.page?'active':''}" data-page="${i}">${i}</button>`;
  }
  if (end < data.pages) html += `${end < data.pages-1?'<span class="page-ellipsis">…</span>':''}<button class="page-btn" data-page="${data.pages}">${data.pages}</button>`;

  // Next
  html += `<button class="page-btn" ${data.page===data.pages?'disabled':''} data-page="${data.page+1}">Next →</button>`;

  el.innerHTML = html;
}

async function loadTenders() {
  document.getElementById('tender-list').innerHTML = '<div class="loading">Loading tenders…</div>';
  try {
    const data = await fetchJSON(`${API.tenders}?${buildQuery()}`);
    renderTenders(data);
    renderPagination(data);
  } catch (e) {
    document.getElementById('tender-list').innerHTML = `<div class="error">Error loading tenders: ${e.message}</div>`;
  }
}

async function loadStats() {
  try {
    const s = await fetchJSON(API.stats);
    document.getElementById('stat-total').textContent = s.total_tenders.toLocaleString('en-ZA');
    document.getElementById('stat-active').textContent = s.active_tenders.toLocaleString('en-ZA');
    document.getElementById('stat-value').textContent = new Intl.NumberFormat('en-ZA', { style:'currency', currency:'ZAR', maximumFractionDigits:0 }).format(s.total_value_zar);
    document.getElementById('stat-7d').textContent = s.new_last_7_days.toLocaleString('en-ZA');
  } catch (e) {
    console.error('Stats error', e);
  }
}

async function loadFilters() {
  try {
    const f = await fetchJSON(API.filters);
    const setOpts = (id, items) => {
      const sel = document.getElementById(id);
      const cur = sel.value;
      sel.innerHTML = `<option value="">${sel.options[0].text}</option>` + items.map(i => `<option value="${escapeHtml(i)}">${escapeHtml(i)}</option>`).join('');
      sel.value = cur;
    };
    setOpts('filter-province', f.provinces);
    setOpts('filter-category', f.categories);
    setOpts('filter-source', f.sources);
  } catch (e) {
    console.error('Filters error', e);
  }
}

async function triggerIngest() {
  const btn = document.getElementById('ingest-btn');
  btn.disabled = true; btn.textContent = 'Refreshing…';
  try {
    await fetch(API.ingest, { method: 'POST' });
    await Promise.all([loadStats(), loadFilters(), loadTenders()]);
  } catch (e) {
    alert('Refresh failed: ' + e.message);
  } finally {
    btn.disabled = false; btn.textContent = '🔄 Refresh Data';
  }
}

// Event wiring
document.getElementById('search-btn').addEventListener('click', () => {
  state.q = document.getElementById('search-input').value.trim();
  state.page = 1;
  loadTenders();
});

document.getElementById('search-input').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') document.getElementById('search-btn').click();
});

document.getElementById('reset-btn').addEventListener('click', () => {
  state = { q:'', province:'', category:'', source:'', status:'', sort_by:'published_date', sort_order:'desc', page:1, page_size:20 };
  document.getElementById('search-input').value = '';
  document.getElementById('filter-province').value = '';
  document.getElementById('filter-category').value = '';
  document.getElementById('filter-source').value = '';
  document.getElementById('filter-status').value = '';
  document.getElementById('sort-by').value = 'published_date';
  document.getElementById('sort-order').value = 'desc';
  loadTenders();
});

document.getElementById('ingest-btn').addEventListener('click', triggerIngest);

['filter-province','filter-category','filter-source','filter-status','sort-by','sort-order'].forEach(id => {
  document.getElementById(id).addEventListener('change', (e) => {
    const key = id.replace('filter-','').replace('sort-','sort_');
    state[key] = e.target.value;
    state.page = 1;
    loadTenders();
  });
});

document.getElementById('pagination').addEventListener('click', (e) => {
  if (e.target.matches('button[data-page]') && !e.target.disabled) {
    state.page = parseInt(e.target.dataset.page);
    loadTenders();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
});

// Init
(async () => {
  await Promise.all([loadStats(), loadFilters()]);
  await loadTenders();
})();
</script>
</body>
</html>

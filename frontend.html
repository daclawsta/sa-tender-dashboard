<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SA Tender Dashboard</title>
<style>
  :root { --bg:#f5f7fa; --card:#fff; --primary:#1a56db; --text:#111827; --muted:#6b7280; --border:#e5e7eb; --red:#dc2626; --green:#16a34a; --amber:#d97706; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--text); }
  header { background:var(--primary); color:#fff; padding:1rem 1.25rem; }
  header h1 { margin:0; font-size:1.25rem; }
  .wrap { max-width:1100px; margin:0 auto; padding:1rem; }
  .stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:1rem; margin-bottom:1rem; }
  .stat { background:var(--card); border:1px solid var(--border); border-radius:.5rem; padding:1rem; text-align:center; }
  .stat .num { font-size:1.5rem; font-weight:700; }
  .stat .lbl { color:var(--muted); font-size:.85rem; }
  .filters { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:.75rem; margin-bottom:1rem; }
  .filters input, .filters select { padding:.55rem .65rem; border:1px solid var(--border); border-radius:.4rem; font-size:.95rem; width:100%; }
  .filters button { padding:.55rem .9rem; border:none; border-radius:.4rem; background:var(--primary); color:#fff; font-size:.95rem; cursor:pointer; }
  table { width:100%; border-collapse:collapse; background:var(--card); border:1px solid var(--border); border-radius:.5rem; overflow:hidden; }
  th, td { padding:.65rem .75rem; text-align:left; border-bottom:1px solid var(--border); font-size:.92rem; }
  th { background:#f8fafc; color:var(--muted); font-weight:600; }
  tr:hover { background:#f8fafc; }
  .status { display:inline-block; padding:.15rem .45rem; border-radius:.25rem; font-size:.78rem; font-weight:600; text-transform:uppercase; }
  .status.open { background:#dcfce7; color:var(--green); }
  .status.closed { background:#fee2e2; color:var(--red); }
  .status.awarded { background:#fef3c7; color:var(--amber); }
  .value { font-variant-numeric:tabular-nums; font-weight:600; }
  .muted { color:var(--muted); font-size:.82rem; }
  .link { color:var(--primary); text-decoration:none; font-weight:500; }
  .link:hover { text-decoration:underline; }
  .pages { display:flex; gap:.5rem; justify-content:center; margin-top:1rem; }
  .pages button { padding:.35rem .6rem; border:1px solid var(--border); background:#fff; border-radius:.35rem; cursor:pointer; }
  .pages button[disabled] { opacity:.5; cursor:default; }
  .pages button.active { background:var(--primary); color:#fff; border-color:var(--primary); }
  .empty { text-align:center; padding:2rem; color:var(--muted); }
  @media (max-width:700px) {
    table, thead, tbody, th, td, tr { display:block; }
    thead { display:none; }
    tr { margin-bottom:.75rem; border:1px solid var(--border); border-radius:.5rem; padding:.5rem; }
    td { display:flex; justify-content:space-between; padding:.4rem .5rem; border:none; }
    td::before { content:attr(data-label); font-weight:600; color:var(--muted); }
  }
</style>
</head>
<body>
<header><h1>SA Tender Dashboard</h1></header>
<div class="wrap">
  <div class="stats" id="stats"></div>
  <div class="filters">
    <input id="q" placeholder="Search title, agency, description…">
    <select id="status"><option value="">All statuses</option><option value="open">Open</option><option value="closed">Closed</option><option value="awarded">Awarded</option><option value="cancelled">Cancelled</option></select>
    <input id="agency" placeholder="Agency">
    <input id="category" placeholder="Category">
    <button onclick="load(1)">Search</button>
  </div>
  <table>
    <thead><tr><th>ID</th><th>Title</th><th>Agency</th><th>Category</th><th>Status</th><th>Value</th><th>Closing</th><th>Link</th></tr></thead>
    <tbody id="tbody"><tr><td colspan="8" class="empty">Loading…</td></tr></tbody>
  </table>
  <div class="pages" id="pages"></div>
</div>
<script>
const API = '';
let state = { page:1, per_page:10, total:0 };
async function stats() {
  const r = await fetch(API+'/api/stats');
  const d = await r.json();
  const el = document.getElementById('stats');
  const cards = [
    {k:'Total',v:d.total},
    {k:'Open',v:d.by_status.open||0},
    {k:'Closed',v:d.by_status.closed||0},
    {k:'Awarded',v:d.by_status.awarded||0}
  ];
  el.innerHTML = cards.map(c=>`<div class="stat"><div class="num">${c.v}</div><div class="lbl">${c.k}</div></div>`).join('');
}
async function load(page=1) {
  state.page = page;
  const q = document.getElementById('q').value;
  const status = document.getElementById('status').value;
  const agency = document.getElementById('agency').value;
  const category = document.getElementById('category').value;
  const params = new URLSearchParams({page, per_page: state.per_page});
  if(q) params.set('q',q); if(status) params.set('status',status); if(agency) params.set('agency',agency); if(category) params.set('category',category);
  const r = await fetch(API+'/api/tenders?'+params.toString());
  const d = await r.json();
  state.total = d.total;
  const tbody = document.getElementById('tbody');
  if(!d.results.length) { tbody.innerHTML='<tr><td colspan="8" class="empty">No tenders found.</td></tr>'; }
  else {
    tbody.innerHTML = d.results.map(t=>`
      <tr>
        <td data-label="ID">${t.external_id}</td>
        <td data-label="Title"><a class="link" href="${t.url||'#'}" target="_blank">${t.title}</a></td>
        <td data-label="Agency">${t.agency}</td>
        <td data-label="Category">${t.category||'—'}</td>
        <td data-label="Status"><span class="status ${t.status}">${t.status}</span></td>
        <td data-label="Value" class="value">${fmt(t.value_amount)} ${t.value_currency}</td>
        <td data-label="Closing">${t.closing_date||'—'}</td>
        <td data-label="Link"><a class="link" href="${t.url||'#'}" target="_blank">Open →</a></td>
      </tr>`).join('');
  }
  renderPages();
}
function fmt(n){ if(n==null) return '—'; return new Intl.NumberFormat('en-AU',{style:'currency',currency:'AUD',maximumFractionDigits:0}).format(n); }
function renderPages(){
  const pages = Math.ceil(state.total/state.per_page)||1;
  const el = document.getElementById('pages');
  let html='';
  if(state.page>1) html+=`<button onclick="load(${state.page-1})">← Prev</button>`;
  let start=Math.max(1,state.page-2), end=Math.min(pages,start+4);
  if(end-start<4) start=Math.max(1,end-4);
  for(let i=start;i<=end;i++) html+=`<button class="${i===state.page?'active':''}" onclick="load(${i})">${i}</button>`;
  if(state.page<pages) html+=`<button onclick="load(${state.page+1})">Next →</button>`;
  el.innerHTML=html;
}
document.getElementById('q').addEventListener('keydown',e=>{ if(e.key==='Enter') load(1); });
stats(); load(1);
</script>
</body>
</html>
